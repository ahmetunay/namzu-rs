[package]
name = "namzu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "namzu-rs"
path = "src/main.rs"

[dependencies]
namzu-ag-ui.workspace = true
sha2 = "0.10"
namzu-telemetry.workspace = true
namzu-capabilities.workspace = true
namzu-sandbox.workspace = true
namzu-core.workspace = true
namzu-lsp.workspace = true
namzu-audio.workspace = true
namzu-mcp.workspace = true
namzu-tools.workspace = true
namzu-provider.workspace = true
namzu-session.workspace = true
namzu-bench.workspace = true
namzu-tui.workspace = true
namzu-pals.workspace = true
namzu-computer.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tempfile.workspace = true
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
