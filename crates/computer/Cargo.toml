[package]
name = "namzu-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
namzu-sandbox.workspace = true
namzu-core.workspace = true
namzu-mcp.workspace = true
namzu-tools.workspace = true
namzu-session.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
cap-std = "3"
getrandom = "0.4"
libc = "0.2"
tempfile.workspace = true
png = "0.17"
x11rb = { version = "0.13", features = ["xtest"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
url = "2"

[[bin]]
name = "namzu-guest"
path = "src/bin/guest.rs"

[[bin]]
name = "namzu-desktop"
path = "src/bin/desktop.rs"

[[bin]]
name = "namzu-browser"
path = "src/bin/browser.rs"
