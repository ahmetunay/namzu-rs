[workspace]
members = ["crates/core", "crates/tools", "crates/provider", "crates/cli", "crates/session", "crates/bench", "crates/tui", "crates/pals", "crates/computer", "crates/mcp", "crates/audio", "crates/lsp", "crates/sandbox"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
namzu-core = { path = "crates/core" }
namzu-tools = { path = "crates/tools" }
namzu-provider = { path = "crates/provider" }
namzu-session = { path = "crates/session" }
namzu-bench = { path = "crates/bench" }
namzu-tui = { path = "crates/tui" }
namzu-pals = { path = "crates/pals" }
namzu-computer = { path = "crates/computer" }
namzu-mcp = { path = "crates/mcp" }
namzu-audio = { path = "crates/audio" }
namzu-lsp = { path = "crates/lsp" }
namzu-sandbox = { path = "crates/sandbox" }
